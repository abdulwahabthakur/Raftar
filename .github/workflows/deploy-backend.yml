name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/supabase/migrations/**'
      - 'backend/supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Migrations + Edge Functions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Run migrations
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy start-run
          supabase functions deploy end-run
          supabase functions deploy submit-capture
          supabase functions deploy get-leaderboard
          supabase functions deploy send-territory-notifications
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify deployment
        run: |
          echo "Checking Edge Functions are live..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/get-leaderboard?type=distance&period=week")
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "401" ]; then
            echo "Unexpected status $STATUS from get-leaderboard"
            exit 1
          fi
          echo "Edge Functions responding (status $STATUS — 401 expected when no auth)"
